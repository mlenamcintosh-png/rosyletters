<section>

<h1 class="section-title">
My Little Journal 📖
</h1>

<p class="journal-intro">
Little thoughts, memories, moments and things I want to remember. ♡
</p>


<!-- NEW ENTRY -->

<div class="journal-form">

<h2>
✍️ Write a New Entry
</h2>

<label for="entryTitle">
Title
</label>

<input
type="text"
id="entryTitle"
placeholder="Give your entry a title...">


<label for="entryDate">
Date
</label>

<input
type="date"
id="entryDate">


<label for="entryText">
Your thoughts
</label>

<textarea
id="entryText"
rows="8"
placeholder="Write whatever is on your mind..."></textarea>


<button
class="button"
onclick="saveEntry()">

🌸 Save Entry

</button>

</div>


<!-- JOURNAL ENTRIES -->

<div id="journalEntries">

</div>


<div class="journal-note">

<p>
♡ This journal is a little collection of moments worth keeping. ♡
</p>

</div>


</section>


<footer>

♡ Ellie ♡

</footer>
