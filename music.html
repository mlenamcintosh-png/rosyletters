<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ellie's Music ♡</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>

<a href="favorites.html">Favorites</a>

<section>

<h1 class="section-title">
🎧 Ellie's Music Corner
</h1>


<p class="music-intro">
A little place for all my favorite songs. ♡
</p>


<!-- MUSIC PLAYER -->

<div class="music-player">

    <div class="album-art">
        🎀
    </div>

    <h2 id="songTitle">
        Song One
    </h2>

    <p id="artistName">
        Artist
    </p>


    <audio id="audioPlayer">
        <source
            id="audioSource"
            src="music/song1.mp3"
            type="audio/mpeg">
    </audio>


    <div class="progress-container">

        <span id="currentTime">
            0:00
        </span>

        <input
            type="range"
            id="progressBar"
            value="0"
            min="0"
            max="100">

        <span id="duration">
            0:00
        </span>

    </div>


    <div class="player-controls">

        <button
            class="music-button"
            id="previousButton"
            type="button">

            ⏮️

        </button>


        <button
            class="play-button"
            id="playButton"
            type="button">

            ▶️

        </button>


        <button
            class="music-button"
            id="nextButton"
            type="button">

            ⏭️

        </button>

    </div>


    <div class="volume-control">

        🔊

        <input
            type="range"
            id="volumeBar"
            min="0"
            max="1"
            step="0.01"
            value="1">

    </div>

</div>


<!-- PLAYLIST -->

<h2 class="section-title">
🎀 My Playlist
</h2>


<div class="playlist" id="playlist">


    <button
        class="playlist-song"
        data-song="0"
        type="button">

        <span>
            🎵
        </span>

        <span class="song-info">

            <strong>
                Song One
            </strong>

            <small>
                Artist
            </small>

        </span>

    </button>


    <button
        class="playlist-song"
        data-song="1"
        type="button">

        <span>
            🌸
        </span>

        <span class="song-info">

            <strong>
                Song Two
            </strong>

            <small>
                Artist
            </small>

        </span>

    </button>


    <button
        class="playlist-song"
        data-song="2"
        type="button">

        <span>
            🌷
        </span>

        <span class="song-info">

            <strong>
                Song Three
            </strong>

            <small>
                Artist
            </small>

        </span>

    </button>


</div>


<div class="card music-note">

    <h2>
        💗 Music Note
    </h2>

    <p>
        This little player is for songs that make
        ordinary moments feel a little more special.
    </p>

</div>


</section>


<footer>

♡ Ellie ♡

</footer>


<script>

const songs = [

    {
        title: "Song One",
        artist: "Artist",
        file: "music/song1.mp3"
    },

    {
        title: "Song Two",
        artist: "Artist",
        file: "music/song2.mp3"
    },

    {
        title: "Song Three",
        artist: "Artist",
        file: "music/song3.mp3"
    }

];


const audio =
    document.getElementById("audioPlayer");

const audioSource =
    document.getElementById("audioSource");

const playButton =
    document.getElementById("playButton");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const progressBar =
    document.getElementById("progressBar");

const volumeBar =
    document.getElementById("volumeBar");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const songTitle =
    document.getElementById("songTitle");

const artistName =
    document.getElementById("artistName");


let currentSong = 0;


function loadSong(index) {

    currentSong = index;

    const song = songs[currentSong];

    songTitle.textContent =
        song.title;

    artistName.textContent =
        song.artist;

    audioSource.src =
        song.file;

    audio.load();

    playButton.textContent =
        "▶️";

}


function playSong() {

    audio.play();

    playButton.textContent =
        "⏸️";

}


function pauseSong() {

    audio.pause();

    playButton.textContent =
        "▶️";

}


playButton.addEventListener(
    "click",
    function() {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    }
);


nextButton.addEventListener(
    "click",
    function() {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


previousButton.addEventListener(
    "click",
    function() {

        currentSong--;

        if (currentSong < 0) {

            currentSong = songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    }
);


audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration) return;

        const progress =
            (audio.currentTime / audio.duration) * 100;

        progressBar.value =
            progress;

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(audio.duration);

    }
);


audio.addEventListener(
    "ended",
    function() {

        currentSong++;

        if (currentSong >= songs.length) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


progressBar.addEventListener(
    "input",
    function() {

        if (!audio.duration) return;

        audio.currentTime =
            (progressBar.value / 100) *
            audio.duration;

    }
);


volumeBar.addEventListener(
    "input",
    function() {

        audio.volume =
            volumeBar.value;

    }
);


function formatTime(seconds) {

    if (isNaN(seconds)) {

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        Math.floor(seconds % 60);

    return minutes + ":" +
        String(remainingSeconds)
        .padStart(2, "0");

}


document
    .querySelectorAll(".playlist-song")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                const songNumber =
                    Number(
                        button.dataset.song
                    );

                loadSong(songNumber);

                playSong();

            }
        );

    });


loadSong(0);

</script>


</body>

</html>
