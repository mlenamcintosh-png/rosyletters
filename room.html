<section>

<h1 class="section-title">
🛏️ My Room
</h1>

<div class="card">

<h2>
Design your dream room
</h2>

<p>
Choose furniture and decorations,
then drag them around your room.
</p>

</div>


<div class="room-controls">

<button onclick="addRoomItem('🛏️')">
Bed
</button>

<button onclick="addRoomItem('🪑')">
Chair
</button>

<button onclick="addRoomItem('🛋️')">
Sofa
</button>

<button onclick="addRoomItem('🪞')">
Mirror
</button>

<button onclick="addRoomItem('🪴')">
Plant
</button>

<button onclick="addRoomItem('🧸')">
Plushie
</button>

<button onclick="addRoomItem('💡')">
Lamp
</button>

<button onclick="addRoomItem('📚')">
Bookshelf
</button>

<button onclick="addRoomItem('📺')">
TV
</button>

<button onclick="addRoomItem('🎸')">
Instrument
</button>

<button onclick="addRoomItem('🕯️')">
Candle
</button>

<button onclick="addRoomItem('🖼️')">
Picture
</button>

</div>


<div
class="room"
id="room">

<div
class="room-item"
style="left:40%;top:55%;">

🛏️

</div>

<div
class="room-item"
style="left:15%;top:55%;">

🪴

</div>

<div
class="room-item"
style="left:75%;top:50%;">

🪞

</div>

</div>


<section>

<h2 class="section-title">
🎀 Character Creator
</h2>

<div class="character-preview">

🧍🏽‍♀️

</div>


<div class="customizer">

<div class="card">

<h3>
Skin
</h3>

<select>

<option>Light</option>
<option>Medium Light</option>
<option>Medium</option>
<option>Medium Dark</option>
<option>Dark</option>

</select>

</div>


<div class="card">

<h3>
Hair
</h3>

<select>

<option>Long</option>
<option>Short</option>
<option>Curly</option>
<option>Wavy</option>
<option>Braids</option>
<option>Ponytail</option>

</select>

</div>


<div class="card">

<h3>
Style
</h3>

<select>

<option>Casual</option>
<option>Formal</option>
<option>Traditional</option>
<option>Homewear</option>
<option>Fantasy</option>

</select>

</div>


<div class="card">

<h3>
Accessories
</h3>

<select>

<option>None</option>
<option>Bow</option>
<option>Glasses</option>
<option>Hat</option>
<option>Earrings</option>
<option>Necklace</option>

</select>

</div>


<div class="card">

<h3>
Mobility
</h3>

<select>

<option>Standing</option>
<option>Wheelchair</option>
<option>Prosthetic</option>
<option>Cane</option>
<option>Crutches</option>

</select>

</div>

</div>

</section>

</section>


<script src="script.js"></script>

</body>

</html>
