<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Room ♡</title>

    <link
        rel="stylesheet"
        href="room.css"
    >

</head>


<body>


<header class="room-header">

    <a
        href="index.html"
        class="back-button"
    >
        ← Back Home
    </a>


    <div class="room-heading">

        <h1>
            My Little Room ♡
        </h1>

        <p>
            decorate your own cozy little space
        </p>

    </div>


    <div class="header-actions">

        <button
            id="saveRoom"
            class="top-button"
        >
            💾 Save
        </button>

        <button
            id="clearRoom"
            class="top-button"
        >
            🧹 Clear
        </button>

    </div>

</header>



<main class="room-designer">


<!-- LEFT SIDE -->

<aside class="room-sidebar">


    <!-- THEMES -->

    <section class="sidebar-card">

        <h2>
            🎨 Room Theme
        </h2>


        <div class="theme-grid">


            <button
                class="theme-button active"
                data-theme="pink"
            >
                Pink
            </button>


            <button
                class="theme-button"
                data-theme="lavender"
            >
                Lavender
            </button>


            <button
                class="theme-button"
                data-theme="cream"
            >
                Cream
            </button>


            <button
                class="theme-button"
                data-theme="sage"
            >
                Sage
            </button>


            <button
                class="theme-button"
                data-theme="dark"
            >
                Dark
            </button>


            <button
                class="theme-button"
                data-theme="blue"
            >
                Blue
            </button>


        </div>

    </section>



    <!-- CATEGORIES -->

    <section class="sidebar-card">

        <h2>
            🛋️ Furniture
        </h2>


        <div class="category-grid">


            <button
                class="category-button active"
                data-category="beds"
            >
                Beds
            </button>


            <button
                class="category-button"
                data-category="seating"
            >
                Seating
            </button>


            <button
                class="category-button"
                data-category="storage"
            >
                Storage
            </button>


            <button
                class="category-button"
                data-category="electronics"
            >
                Electronics
            </button>


            <button
                class="category-button"
                data-category="decor"
            >
                Decor
            </button>


            <button
                class="category-button"
                data-category="plants"
            >
                Plants
            </button>


        </div>


        <div
            id="itemList"
            class="item-list"
        ></div>

    </section>


</aside>



<!-- ROOM SIDE -->

<section class="room-workspace">


    <div class="room-info-bar">

        <span>
            Click furniture to add it.
            Drag furniture to move it.
        </span>

        <span id="roomStatus">
            Ready ♡
        </span>

    </div>



    <div
        id="room"
        class="room theme-pink"
    >


        <div class="room-wall">


            <div class="window">

                <div class="window-sky">
                    ☁️
                </div>

                <div class="window-line vertical"></div>

                <div class="window-line horizontal"></div>

            </div>


            <div class="wall-heart">
                ♡
            </div>


        </div>


        <div class="room-floor"></div>


        <div
            id="roomItems"
            class="room-items"
        ></div>


    </div>



    <!-- ITEM CONTROLS -->

    <div
        id="itemControls"
        class="item-controls hidden"
    >


        <div>

            Selected:

            <strong id="selectedItemName">
                Nothing
            </strong>

        </div>


        <div class="control-grid">


            <button id="rotateLeft">
                ↶ Rotate
            </button>


            <button id="rotateRight">
                ↷ Rotate
            </button>


            <button id="makeSmaller">
                − Smaller
            </button>


            <button id="makeBigger">
                ＋ Bigger
            </button>


            <button id="moveFront">
                ↑ Bring Front
            </button>


            <button id="moveBack">
                ↓ Send Back
            </button>


            <button
                id="deleteItem"
                class="delete-button"
            >
                🗑️ Delete
            </button>


        </div>


    </div>


</section>


</main>



<script src="room.js"></script>


</body>

</html>
